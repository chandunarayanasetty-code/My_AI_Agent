<title>Course Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one wide working table of courses; selecting a row opens its study desk (lesson + quiz) beneath it. */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1b2420; --muted:#667068; --line:#dde2da;
  --accent:#1f6f5c; --accent-fg:#ffffff; --accent-soft:#e2f0ea;
  --good:#2f7d3f; --warn:#b26a00; --bad:#b3372b; --track:#e6eae3;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a211e; --fg:#e6ebe7; --muted:#97a39b; --line:#2b3530;
  --accent:#58c4a4; --accent-fg:#0c1512; --accent-soft:#1d3029;
  --good:#6cc47c; --warn:#e0a24a; --bad:#ec7c70; --track:#2a332f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --fg:#e6ebe7; --muted:#97a39b; --line:#2b3530;
  --accent:#58c4a4; --accent-fg:#0c1512; --accent-soft:#1d3029;
  --good:#6cc47c; --warn:#e0a24a; --bad:#ec7c70; --track:#2a332f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:2px 0 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;min-height:34px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.primary:hover{filter:brightness(1.08)}
.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;min-height:28px}
a.linkbtn{display:inline-flex;align-items:center;text-decoration:none;border-radius:6px;font-size:13px}
a.linkbtn:hover{color:var(--fg)}
.danger{color:var(--bad)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.add{padding:16px;display:grid;grid-template-columns:1fr;gap:12px}
.add[hidden]{display:none}
[hidden]{display:none !important}
.add .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
td button{white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
.cname{font-weight:600;font-family:var(--font-display);font-size:15px;cursor:pointer;background:none;border:0;padding:0;min-height:0;text-align:left;white-space:normal}
.cname:hover{color:var(--accent)}
.scope{color:var(--muted);font-size:12.5px;max-width:240px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.pcell{display:flex;flex-direction:column;gap:5px;min-width:110px}
.progset{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--bg)}
.progset label{margin:0;font-size:11px}
.progset input[type=range]{width:150px;padding:0;border:0;background:transparent;accent-color:var(--accent)}
.progset .progval{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.none{background:var(--track);color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.desk{padding:20px;display:flex;flex-direction:column;gap:18px}
.deskhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.lesson{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);overflow-wrap:anywhere}
.lesson h4{margin:14px 0 4px;font-family:var(--font-display);font-size:15px}
.lesson h4:first-child{margin-top:0}
.lesson p{margin:6px 0}.lesson ul{margin:6px 0;padding-left:20px}
.lesson code{background:var(--track);padding:1px 5px;border-radius:4px;font-size:12.5px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.q{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.opt{text-align:left;width:100%;display:flex;gap:10px;background:var(--surface)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt b{min-width:16px}
.expl{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.history{display:flex;flex-direction:column;gap:6px}
details.hl{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.hl summary{cursor:pointer;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sessions .bar{max-width:360px}
.sesslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 18px;margin-top:10px}
.sess{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--fg);text-transform:none;letter-spacing:0;margin:0;padding:3px 0;cursor:pointer;line-height:1.35}
.sess input{width:auto;margin:2px 0 0;padding:0;border:0;background:none;accent-color:var(--accent);flex:none}
.sess span{overflow-wrap:anywhere}
.sess input:checked+span{color:var(--muted);text-decoration:line-through}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.bar>i{transition:none}}
/* Perfect planning */
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.planbtn{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.planlink{border:1px solid var(--line);background:var(--bg);color:var(--accent);font-size:12px;min-height:28px;padding:3px 9px}
.planlink:hover{border-color:var(--accent)}
.plan{padding:20px;display:flex;flex-direction:column;gap:16px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.plan a{color:var(--accent)}
.planhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.planstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
.stat b{display:block;font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nextup{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.nextrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stepno{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
.planpace{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.planpace label{margin:0}
.stagerail{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.stagecard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.stagecard.active{border-color:var(--accent);background:var(--accent-soft)}
.stagecard .bar{height:6px}
.planblock{margin-top:2px}
.planitem{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.planitem:last-child{border-bottom:0}
.planitem.done{color:var(--muted)}
.planitem.done .plabel{text-decoration:line-through}
.planitem.next{background:var(--accent-soft);margin:0 -6px;padding:6px;border-radius:6px}
.planitem .meta{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.plabel{overflow-wrap:anywhere;min-width:0}
.kbadge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--track);color:var(--muted);white-space:nowrap}
.kbadge.learn{background:var(--accent-soft);color:var(--accent)}
.kbadge.reference{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.kbadge.practice{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.kbadge.interview{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.kbadge.career{background:var(--track);color:var(--fg)}
.wk{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:6px}
.wk summary{cursor:pointer;font-weight:600}
.plancheck{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px}
.topics{margin:6px 0;padding-left:20px;font-size:13px}
.topics li{margin:3px 0}
.gapnote{border-left:2px solid var(--accent);padding-left:10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.planlist{display:flex;flex-direction:column;gap:2px}
@media(max-width:600px){.planstats{grid-template-columns:1fr 1fr}.planitem .meta{width:100%;margin-left:36px;justify-content:flex-start}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">

<div class="wrap">
  <header>
    <div>
      <h1>Course Tracker</h1>
      <p class="sub" id="summary">Loading your courses…</p>
    </div>
    <div class="actions" style="flex-wrap:nowrap">
      <button id="backupBtn" class="ghost" title="Write the saved course data to backup/ on this computer">Save backup</button>
      <a class="ghost linkbtn" href="/code" title="Every file in this project, served from this computer">Code</a>
      <button id="toggleAdd" class="primary">+ Add course</button>
    </div>
  </header>

  <form id="addForm" class="panel add" hidden>
    <div><label for="newName">Course name</label><input id="newName" placeholder="e.g. System Design Fundamentals" required></div>
    <div><label for="newScope">Full course scope (everything that counts as 100%)</label>
      <textarea id="newScope" placeholder="Paste the syllabus, chapter list or topics. It is treated as the complete course and trained from where you are to 100%."></textarea></div>
    <div class="row"><button type="button" id="cancelAdd">Cancel</button><button class="primary" type="submit" id="saveAdd">Save course</button></div>
  </form>

  <div class="panel tablebox" id="tableWrap"></div>
  <div id="deskHost"></div>
</div>

<script>
/* ---------- local runtime: replaces the two claude.ai host APIs ----------
   db     -> localStorage document store with onSnapshot
   sample -> offline lesson / quiz generator built from the pasted syllabus
   Inside the claude.ai artifact viewer window.claude already exists, so this
   block steps aside and the original behaviour is kept. */
(function () {
  if (window.claude && typeof window.claude.use === 'function') return;

  /* ================= db ================= */
  const DB_KEY = 'ct-db-v1';
  const listenerSets = new Map();

  function readDb() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object' && parsed.courses) return parsed;
    } catch (e) {}
    return { courses: {} };
  }
  function writeDb(data) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
    catch (e) { console.warn('Course Tracker: could not persist data', e); }
  }
  function docsOf(name) {
    const col = readDb()[name] || {};
    return Object.keys(col).map(id => ({ id, data: () => col[id] }));
  }
  function emit(name) {
    const set = listenerSets.get(name);
    if (!set) return;
    for (const fn of [...set]) {
      Promise.resolve().then(() => {
        try { fn({ docs: docsOf(name) }); } catch (e) { console.error(e); }
      });
    }
  }
  function subscribe(name, cb) {
    if (!listenerSets.has(name)) listenerSets.set(name, new Set());
    listenerSets.get(name).add(cb);
    const docs = docsOf(name);
    Promise.resolve().then(() => cb({ docs }));
    return () => listenerSets.get(name).delete(cb);
  }
  window.addEventListener('storage', e => {
    if (e.key && e.key !== DB_KEY) return;
    for (const name of [...listenerSets.keys()]) emit(name);
  });

  function makeQuery(name, order) {
    return {
      orderBy(field, dir) { return makeQuery(name, { field, dir: dir === 'desc' ? -1 : 1 }); },
      onSnapshot(cb, errCb) {
        return subscribe(name, snap => {
          let docs = snap.docs;
          if (order) {
            docs = [...docs].sort((a, b) => {
              const av = a.data()[order.field], bv = b.data()[order.field];
              if (av === bv) return 0;
              return (av > bv ? 1 : -1) * order.dir;
            });
          }
          cb({ docs });
        });
      },
      async add(fields) {
        const data = readDb();
        if (!data[name]) data[name] = {};
        const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        data[name][id] = Object.assign({}, fields);
        writeDb(data);
        emit(name);
        return { id };
      },
      doc(id) {
        return {
          async update(patch) {
            const data = readDb();
            if (!data[name] || !data[name][id]) throw new Error('Missing document: ' + id);
            const next = Object.assign({}, data[name][id]);
            for (const k of Object.keys(patch)) {
              if (patch[k] === undefined) delete next[k];
              else next[k] = patch[k];
            }
            data[name][id] = next;
            writeDb(data);
            emit(name);
          },
          async delete() {
            const data = readDb();
            if (data[name]) delete data[name][id];
            writeDb(data);
            emit(name);
          },
          async get() {
            const col = readDb()[name] || {};
            return { exists: !!col[id], id, data: () => col[id] };
          }
        };
      }
    };
  }

  const db = { collection: name => makeQuery(name, { field: 'createdAt', dir: 1 }) };

  /* ================= sample: offline tutor ================= */
  const COURSE_RE = /^Course:\s*(.+)$/m;
  const SCOPE_RE = /^Scope:\n([\s\S]*?)\n\nSplit the scope/m;
  const BLOCK_RE = /I have covered ([\d.]+)% so far\. Teach me the part of the course from ([\d.]+)% to ([\d.]+)%\./;

  function splitScope(scope) {
    const clean = s => s.replace(/^#{1,6}\s*/, '')
      .replace(/^[-*\u2022]\s+/, '')
      .replace(/^\d+[.)]\s*/, '')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/[.;,]$/, '');

    const lines = String(scope || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(clean).filter(Boolean);
    let items = lines;
    if (items.length < 4) {
      const extra = [];
      for (const l of lines) {
        const commas = (l.match(/,/g) || []).length;
        if (commas >= 2 || l.length > 220) {
          for (const part of l.split(/[,;\u2022]|\s\|\s/)) {
            const t = clean(part);
            if (t) extra.push(t);
          }
        } else extra.push(l);
      }
      items = extra;
    }
    const seen = new Set();
    return items.filter(t => {
      const k = t.toLowerCase();
      if (!k || seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function buildLesson(prompt) {
    const cm = prompt.match(COURSE_RE);
    const course = cm ? cm[1].trim() : 'This course';
    const sm = prompt.match(SCOPE_RE);
    const scope = sm ? sm[1] : '';
    const bm = prompt.match(BLOCK_RE);
    const from = bm ? Number(bm[1]) : 0;
    const to = bm ? Number(bm[3]) : Math.min(100, from + 40);
    const items = splitScope(scope || prompt);

    if (!items.length) {
      return ['## ' + course, '- No syllabus text was found for this course.',
        '- Open "Edit scope" (or delete and re-add the course) and paste the chapter or topic list.',
        '- Then press "Train" again to build this block.'].join('\n');
    }

    const n = items.length;
    const picked = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 100, b = ((i + 1) / n) * 100;
      if (b > from && a < to) picked.push(i);
    }
    if (!picked.length) picked.push(Math.min(n - 1, Math.floor((from / 100) * n)));

    const out = [];
    const lm = prompt.match(/^Label:\s*(.+)$/m);
    const heading = lm ? lm[1].trim() : 'Block ' + from + '% to ' + to + '%';
    out.push('## ' + heading + ': ' + picked.length + ' topic' + (picked.length > 1 ? 's' : ''));

    // checklist: the whole block, wrapped so no bullet becomes a wall of text
    for (let i = 0; i < picked.length; i += 5) {
      out.push('- ' + picked.slice(i, i + 5).map(k => items[k]).join(' · '));
    }
    out.push('');

    // detailed walkthrough for a readable number of topics, spread across the block
    const CAP = 10;
    let detailed = picked.filter(i => !/^module\s+\d+/i.test(items[i]));
    if (!detailed.length) detailed = picked;
    if (detailed.length > CAP) {
      const spread = [];
      for (let j = 0; j < CAP; j++) spread.push(detailed[Math.round((j * (detailed.length - 1)) / (CAP - 1))]);
      detailed = [...new Set(spread)];
      out.push('_' + detailed.length + ' of the ' + picked.length + ' topics in this block get a walked-through section below; the checklist above covers the rest._');
      out.push('');
    }

    detailed.forEach(i => {
      const topic = items[i];
      const prev = i > 0 ? items[i - 1] : null;
      const next = i + 1 < n ? items[i + 1] : null;
      out.push('## ' + topic);
      out.push('**Where it sits:** topic ' + (i + 1) + ' of ' + n + ' in ' + course +
        ', roughly ' + Math.round((i / n) * 100) + '% to ' + Math.round(((i + 1) / n) * 100) + '% of the syllabus' +
        (prev ? ', right after ' + prev : ' (opening topic)') +
        (next ? ' and before ' + next : ' (final topic)') + '.');
      out.push('');
      out.push('**Explanation:** Write a one-line definition of ' + topic + ' in your own words, then list the three or four ideas it depends on. Say out loud how it connects to ' +
        (prev || 'the course goal') + ' and to ' + (next || 'the final outcome') + '. If you cannot, the gap is in the earlier topic, not this one.');
      out.push('');
      out.push('**Example:** Build a small worked case for ' + topic +
        ': take one problem or scenario from your notes, work it end to end in five to ten lines, then add one sentence on what the technique bought you.');
      out.push('');
      out.push('**Common mistake:** memorising the name "' + topic + '" and moving on. The real test is applying it to a case where the obvious approach fails.');
      out.push('');
    });

    out.push('## Key takeaways');
    detailed.forEach(i => out.push('- **' + items[i] + '**: you should be able to define it, give one example, and place it between the surrounding topics.'));
    out.push('- This block moves you from ' + from + '% to ' + to + '% of ' + course + '. Mark it complete only when every checklist item above is explainable without notes.');
    out.push('- _Lesson generated locally from your syllabus text (offline mode), not by an AI model._');
    return out.join('\n');
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function sampleFrom(arr, k, exclude) {
    const pool = arr.filter(x => !(exclude || []).includes(x));
    const out = [];
    while (out.length < k && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    return out;
  }
  function mkQuestion(question, correct, distractors, explanation) {
    const opts = [correct, ...distractors.filter(d => d && d !== correct)];
    if (new Set(opts).size !== 4) return null;
    shuffle(opts);
    return { question, options: opts, answer: opts.indexOf(correct), explanation };
  }

  function buildQuiz(prompt) {
    const head = prompt.match(/^Create a random (\d+)-question multiple-choice quiz for the course "(.*?)"\./m);
    const want = head ? Math.max(1, Math.min(10, Number(head[1]))) : 5;
    const course = head ? head[2] : 'this course';
    const sc = prompt.match(/Full course scope \(100%\):\n([\s\S]*?)\n\nThe learner has covered only the first ([\d.]+)%/);
    const scope = sc ? sc[1] : '';
    const covered = sc ? Number(sc[2]) : 100;
    const pv = prompt.match(/Avoid repeating these earlier questions:\n([\s\S]*?)\n\nReturn JSON only/);
    const previous = pv ? pv[1].split('\n').map(s => s.trim()).filter(s => s && s !== '(none)') : [];

    let items = splitScope(scope);
    if (items.length < 4) {
      const tail = prompt.split('Full course scope (100%):')[1] || prompt;
      items = splitScope(tail.replace(/The learner has covered[\s\S]*/, ''));
    }
    if (!items.length) items = [course];

    const n = items.length;
    const splitAt = Math.max(1, Math.min(n, Math.ceil((covered / 100) * n)));
    const isHeading = t => /^module\s+\d+/i.test(t);
    const topicItems = items.filter(t => !isHeading(t));
    const base = topicItems.length >= 6 ? topicItems : items;
    const done = base.slice(0, Math.max(1, Math.ceil((splitAt / n) * base.length)));
    const later = base.slice(done.length);
    const pool = [];
    const usedAnchors = Object.create(null);
    const adjacent = [];
    for (let i = 0; i + 1 < items.length; i++) {
      if (isHeading(items[i]) || isHeading(items[i + 1]) || i + 1 >= splitAt) continue;
      adjacent.push(i);
    }

    const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
    const say = list => list[Math.floor(Math.random() * list.length)];

    const recognise = () => {
      if (!later.length || !done.length) return null;
      const correct = pickOne(done);
      const distractors = sampleFrom(later, 3);
      if (distractors.length < 3) return null;
      return mkQuestion(say([
          'Which of these topics is part of the first ' + covered + '% of "' + course + '"?',
          'Which of these belongs to the part of "' + course + '" you have covered so far?',
          'Which topic have you already reached in "' + course + '"?'
        ]),
        correct, distractors,
        correct + ' is topic ' + (items.indexOf(correct) + 1) + ' of ' + n + ', inside the ' + covered + '% you have covered. The other options come later in the course.');
    };
    const negative = () => {
      if (!later.length || done.length < 3) return null;
      const correct = pickOne(later);
      return mkQuestion(say([
          'Which topic is NOT part of the first ' + covered + '% of "' + course + '"?',
          'Which of these topics have you not reached yet in "' + course + '"?',
          'Which topic still lies ahead of you in "' + course + '"?'
        ]),
        correct, sampleFrom(done, 3),
        correct + ' is topic ' + (items.indexOf(correct) + 1) + ' of ' + n + ', so it sits beyond the ' + covered + '% you have covered.');
    };
    const ordering = () => {
      if (n < 5 || !adjacent.length) return null;
      const i = pickOne(adjacent);
      const anchor = items[i], correct = items[i + 1];
      if (anchor in usedAnchors) return null;
      const distractors = sampleFrom(base, 3, [anchor, correct]);
      if (distractors.length < 3) return null;
      usedAnchors[anchor] = true;
      return mkQuestion(say([
          'In the syllabus order for "' + course + '", which topic comes immediately after "' + anchor + '"?',
          'You have just finished "' + anchor + '" in "' + course + '". What is the next topic in the scope?',
          'Which topic follows "' + anchor + '" in the scope of "' + course + '"?'
        ]),
        correct, distractors,
        'The scope lists ' + correct + ' directly after ' + anchor + ', at position ' + (i + 2) + ' of ' + n + '.');
    };
    const opener = () => {
      if (base.length < 4 || !done.length) return null;
      return mkQuestion(say([
          'Which topic opens the syllabus of "' + course + '"?',
          'Which topic comes first in the scope of "' + course + '"?',
          'Where does the scope of "' + course + '" start?'
        ]),
        base[0], sampleFrom(base.slice(1), 3),
        base[0] + ' is the first topic listed in the scope for this course.');
    };
    const closer = () => {
      if (base.length < 4 || later.length) return null;
      return mkQuestion(say([
          'Which topic closes the syllabus of "' + course + '"?',
          'Which topic is the last one listed in the scope of "' + course + '"?'
        ]),
        base[base.length - 1], sampleFrom(base.slice(0, -1), 3),
        base[base.length - 1] + ' is the final topic listed in the scope for this course.');
    };

    const builders = [recognise, ordering, negative, ordering, opener, closer];
    const seenQ = new Set(previous);
    const takePass = allowRepeat => {
      for (const b of shuffle([...builders])) {
        if (pool.length >= want) return;
        const q = b();
        if (!q) continue;
        if (!allowRepeat && seenQ.has(q.question)) continue;
        seenQ.add(q.question);
        pool.push(q);
      }
    };
    for (let pass = 0; pass < 8 && pool.length < want; pass++) takePass(false);
    for (let pass = 0; pass < 8 && pool.length < want; pass++) takePass(true);

    if (!pool.length) {
      pool.push({
        question: 'Which statement matches the scope you pasted for "' + course + '"?',
        options: ['"' + items[0] + '" is listed in the scope', 'The scope is empty', 'The scope has no topics', 'The course has no syllabus'],
        answer: 0,
        explanation: 'The scope you pasted starts with "' + items[0] + '".'
      });
    }
    return pool;
  }

  const sample = async function () {
    return { text: buildLesson(arguments[0]) };
  };
  sample.json = async function () {
    return buildQuiz(arguments[0]);
  };

  window.claude = {
    async use(name) {
      if (name === 'db') return db;
      if (name === 'sample') return sample;
      return null;
    }
  };
})();
</script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db = null, sample = null, courses = [], selected = null, loaded = false;
const ui = {}; // per-course transient state: {busy, err, quiz:{qs,i,picked,done}, confirmDelete}
const st = id => (ui[id] ||= {});

try { selected = localStorage.getItem('ct-sel'); } catch(e){}

function confClass(c){ return c==null?'none':c>=75?'good':c>=45?'warn':'bad'; }
function displayScope(s){
  return String(s || 'No scope added')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^[-*\u2022]\s+/gm, '')
    .replace(/\s*\n+\s*/g, ' \u00b7 ')
    .replace(/[ \t]{2,}/g, ' ')
    .trim() || 'No scope added';
}
function lessonHtml(t){
  const lines = String(t||'').split('\n'); let out='', inList=false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  for (const raw of lines){
    const l = raw.trim();
    if (/^[-*] /.test(l)){ if(!inList){out+='<ul>';inList=true} out+='<li>'+inline(l.slice(2))+'</li>'; continue; }
    if (inList){out+='</ul>';inList=false}
    if (/^#{1,4} /.test(l)) out+='<h4>'+inline(l.replace(/^#+ /,''))+'</h4>';
    else if (l) out+='<p>'+inline(l)+'</p>';
  }
  return out + (inList?'</ul>':'');
}

/* ---------- render ---------- */
function render(){
  const n = courses.length;
  const avg = n ? Math.round(courses.reduce((a,c)=>a+(c.progress||0),0)/n) : 0;
  $('summary').textContent = !loaded ? 'Loading your courses…' :
    n ? `${n} course${n>1?'s':''} · ${avg}% average completion` : 'No courses yet. Add your first one.';
  renderTable(); renderDesk();
}
function renderTable(){
  if (!loaded){ $('tableWrap').innerHTML='<div class="empty">Loading…</div>'; return; }
  if (!courses.length){ $('tableWrap').innerHTML='<div class="empty">Nothing here yet. Use “Add course” and paste the full syllabus so I know what 100% means.</div>'; return; }
  let h = `<table><thead><tr><th>Course</th><th>Scope (100%)</th><th>Completed</th><th>Training</th><th>Quiz</th><th>Confidence</th></tr></thead><tbody>`;
  for (const c of courses){
    const s = st(c.id), p = c.progress||0, done = p>=100;
    const pend = c.pending ? ' (lesson waiting)' : '';
    h += `<tr class="${c.id===selected?'sel':''}">
      <td><button class="cname" data-open="${c.id}">${esc(c.name)}</button><div class="small">${(c.quizTotal||0)} quiz answers</div></td>
      <td><div class="scope">${esc(displayScope(c.scope))}</div></td>
      <td><div class="pcell"><span class="num">${p}%</span><div class="bar"><i style="width:${p}%"></i></div></div></td>
      <td><button class="primary" data-train="${c.id}" ${s.busy||done||blockRange(c).marked===0?'disabled':''}>${s.busy==='train'?'<span class="spin"></span>Preparing…':done?'Course done':c.pending?'Open lesson':blockRange(c).marked===0?'Tick items first':blockLabel(c)}</button><div style="margin-top:6px"><button class="planlink" data-plan="${c.id}">Perfect plan</button></div></td>
      <td><button data-quiz="${c.id}" ${s.busy||p<=0?'disabled':''} title="${p<=0?'Complete some training first':''}">${s.busy==='quiz'?'<span class="spin"></span>Building…':'Quiz me'}</button></td>
      <td><span class="pill ${confClass(c.confidence)}">${c.confidence==null?'Not tested':Math.round(c.confidence)+'%'}</span></td>
    </tr>`;
  }
  $('tableWrap').innerHTML = h+'</tbody></table>';
}
function sessionsView(c){
  const list = c.sessions || [];
  if (!list.length) return '';
  const done = list.filter(s => s.done).length;
  const pct = Math.round((done / list.length) * 100);
  const mods = [];
  for (const s of list) {
    let m = mods.find(x => x.name === s.module);
    if (!m) { m = { name: s.module, items: [] }; mods.push(m); }
    m.items.push(s);
  }
  let h = `<div class="sec sessions"><h3>Portal progress</h3>
    <div class="small">${done} of ${list.length} items done · ${pct}% · QA sessions excluded</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
  for (const m of mods) {
    const md = m.items.filter(s => s.done).length;
    const ui = st(c.id);
    const openMods = ui.openMods || {};
    const open = m.name in openMods ? openMods[m.name] : (md > 0 && md < m.items.length);
    h += `<details class="hl" data-mod="${esc(m.name)}"${open ? ' open' : ''}>
      <summary>${esc(m.name)} &#183; ${md}/${m.items.length}</summary>
      <div class="sesslist">`;
    for (const s of m.items) {
      h += `<label class="sess"><input type="checkbox" data-sess="${esc(s.id)}"${s.done ? ' checked' : ''}><span>${esc(s.label)}</span></label>`;
    }
    const confirming = md === m.items.length && ui.clear === m.name;
    h += `</div><div class="actions">` + (md === m.items.length
      ? (confirming
          ? `<button class="danger" data-sessclear="${esc(m.name)}">Yes, clear ${md} tick${md === 1 ? '' : 's'}</button><button class="ghost" data-sessclearno="1">Keep</button>`
          : `<button class="ghost" data-sessask="${esc(m.name)}">Clear module</button>`)
      : `<button class="ghost" data-sessall="${esc(m.name)}">Mark module done</button>`) +
      `</div></details>`;
  }
  return h + '</div>';
}
function fmtMin(m){
  m = Math.max(0, Math.round(m || 0));
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}
function fmtHours(m){
  const h = (m || 0) / 60;
  return (h < 10 ? Math.round(h * 10) / 10 : Math.round(h)) + ' h';
}
function fmtDate(d){
  try { return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }); }
  catch (e) { return d.toDateString(); }
}
function planOpenFor(c){
  const s = st(c.id);
  if (s.planOpen === undefined) {
    try { s.planOpen = localStorage.getItem('ct-plan-open') === c.id; }
    catch (e) { s.planOpen = false; }
  }
  return s.planOpen;
}
function setPlanOpen(c, open){
  st(c.id).planOpen = open;
  try {
    if (open) localStorage.setItem('ct-plan-open', c.id);
    else if (localStorage.getItem('ct-plan-open') === c.id) localStorage.removeItem('ct-plan-open');
  } catch (e) {}
}
function planItemHtml(x, next){
  const isNext = next && x.step === next.step;
  return `<div class="planitem${x.done ? ' done' : ''}${isNext ? ' next' : ''}">
    <span class="stepno">${x.step}</span>
    <span class="plabel">${esc(x.label)}</span>
    <span class="meta"><span class="kbadge ${x.kind}">${kindLabel(x.kind)}</span><span>${x.min} min</span>${x.done ? '<span>done</span>' : ''}</span>
  </div>`;
}
function planHtml(c){
  const p = buildPlan(c);
  if (!p.route.length) return `<section class="panel plan" id="planPanel">
    <div class="planhead"><div><div class="tag">Perfect planning</div><h2>No route yet</h2>
      <div class="small">This course has no portal item list and no syllabus scope. Add the syllabus with <b>Edit scope</b> (or paste the portal list) and the route will be generated from it.</div></div>
      <div class="actions"><button class="ghost" data-planclose="1">Hide</button></div></div></section>`;
  const next = p.next;
  const trainHint = isItemCourse(c)
    ? `If it is already ticked, use <b>Train marked (${markedItems(c).length})</b> to revise only your ticks.`
    : `Use <b>Train ${Math.round(c.progress || 0)}% \u2192 100%</b> to study the next block.`;
  let h = `<section class="panel plan" id="planPanel">
    <div class="planhead"><div><div class="tag">Perfect planning</div>
      <h2>Exact route to finish ${esc(c.name)}</h2>
      <div class="small">Built from the brochure, the ${p.route.length}-item portal list, your ticks, notes, project briefs, interview banks and official docs. Times are study estimates, not video lengths.</div></div>
      <div class="actions"><button data-plancopy="1">Copy route map</button><button class="ghost" data-planclose="1">Hide</button></div></div>
    <div class="planstats">
      <div class="stat"><b>${p.remaining.length}</b><span>steps left / ${p.route.length}</span></div>
      <div class="stat"><b>${fmtMin(p.totalMinutes)}</b><span>study time left</span></div>
      <div class="stat"><b>${p.weekCount}</b><span>weeks at ${p.hours} h/week</span></div>
      <div class="stat"><b>${Math.round(c.progress || 0)}%</b><span>${isItemCourse(c) ? 'portal completion' : 'course progress'}</span></div>
      ${p.gap ? `<div class="stat"><b>${fmtHours(p.fullMinutes)}</b><span>full-syllabus time</span></div>` : ''}
    </div>`;
  if (p.gap) h += `<div class="small">Full-syllabus mastery adds about ${fmtMin(p.gap.minutes)} for ${p.gap.missing} unrecorded and ${p.gap.partial} partly covered brochure modules, about ${p.fullWeeks} weeks all-in at this pace. The portal can reach 100% sooner; the gap map is what makes the result interview-ready.</div>`;
  if (next) {
    const after = p.remaining.slice(1, 4).map(x => esc(x.label)).join(' \u2192 ');
    h += `<div class="nextup"><div class="small">Next exact step \u00b7 ${next.step} of ${p.route.length} \u00b7 ${esc(next.module)}</div>
      <div class="nextrow"><span class="stepno">${next.step}</span><b>${esc(next.label)}</b><span class="kbadge ${next.kind}">${kindLabel(next.kind)}</span><span class="small">${next.min} min</span></div>
      ${after ? `<div class="small">Then: ${after}${p.remaining.length > 4 ? ' \u2192 \u2026' : ''}</div>` : ''}
      <div class="small">Do it, then tick it in Portal progress. ${trainHint}</div></div>`;
  } else {
    h += `<div class="nextup"><b>Portal route complete.</b><div class="small">All ${p.route.length} items are ticked. Move to the full-syllabus gap map, then run mock interviews and publish the portfolio.</div></div>`;
  }
  h += `<div class="planpace"><label for="planHours">Study pace</label>
    <select id="planHours">${[5, 8, 10, 15, 20, 25].map(v => `<option value="${v}"${v === p.hours ? ' selected' : ''}>${v} h per week</option>`).join('')}</select>
    <span class="small">~${p.weekCount} week${p.weekCount === 1 ? '' : 's'} \u00b7 portal finish around <b>${fmtDate(p.finish)}</b>${p.gap ? ` \u00b7 full syllabus around <b>${fmtDate(p.fullFinish)}</b>` : ''}</span>
    <span class="small" id="planMsg"></span></div>`;
  h += `<div class="sec"><h3>Critical path</h3>
    <div class="small">The order is dependency-driven, not portal order: Linux before Git, Jenkins, Docker and Kubernetes; Git before CI; CI before Docker delivery; Docker before Kubernetes; cloud before everything.</div>
    <div class="stagerail">`;
  p.stages.forEach((stage, i) => {
    const pct = stage.total ? Math.round(stage.done / stage.total * 100) : 0;
    const active = stage.next && next && stage.key === next.stageKey;
    h += `<div class="stagecard${active ? ' active' : ''}"><div><b>${i + 1}. ${esc(stage.title)}</b></div>
      <div class="small">${stage.done}/${stage.total} done \u00b7 ${fmtHours(stage.minutes)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="small">${esc(stage.why)}</div>
      ${active ? `<div class="small"><b>Next:</b> ${esc(stage.next.label)}</div>` : ''}</div>`;
  });
  h += `</div></div>`;
  h += planWeeksHtml(p);
  h += planRouteHtml(p);
  if (p.gap) h += planGapHtml(p);
  h += planProtocolHtml(p);
  h += planSourcesHtml(p);
  return h + '</section>';
}
function planWeeksHtml(p){
  if (!p.weeks.length) return `<div class="sec"><h3>Week-by-week route</h3><div class="small">Nothing left in the portal route. Use the gap map below, then revise with Train marked.</div></div>`;
  let h = `<div class="sec"><h3>Week-by-week route</h3>
    <div class="small">${p.weeks.length} week${p.weeks.length === 1 ? '' : 's'} at ${p.hours} h/week. Each week is capped at your pace; one long project may spill into the next week. Checkpoints are pass/fail: if you cannot do the checkpoint, repeat the week's recall drill before moving on.</div>`;
  p.weeks.forEach((w, i) => {
    const stages = [...new Set(w.items.map(x => x.stageTitle))];
    const focus = stages.slice(0, 2).join(' \u2192 ') + (stages.length > 2 ? ' +' + (stages.length - 2) : '');
    h += `<details class="wk"${i === 0 ? ' open' : ''}><summary>Week ${i + 1} \u00b7 ${fmtHours(w.min)} \u00b7 ${w.items.length} step${w.items.length === 1 ? '' : 's'} \u00b7 ${esc(focus)}</summary>
      <div class="planlist">${w.items.map(x => planItemHtml(x, p.next)).join('')}</div>`;
    if (i > 0) h += `<div class="plancheck">Spaced review first: spend 15 minutes recalling last week's items before starting.</div>`;
    if (w.milestones && w.milestones.length) {
      h += w.milestones.map(st => `<div class="plancheck">Milestone \u2014 ${esc(st.title)}: ${esc(st.checkpoint)}</div>`).join('');
    } else {
      h += `<div class="plancheck">Recall drill: close the notes and explain the week's first and last topic out loud.</div>`;
    }
    h += `</details>`;
  });
  return h + `</div>`;
}
function planRouteHtml(p){
  let h = `<details class="hl planblock"><summary><b>Full route map</b> \u00b7 ${p.route.length} exact steps \u00b7 ${p.remaining.length} left</summary>
    <div class="small" style="margin:6px 0 10px">Steps are numbered once, in dependency order. Notes are moved next to the module they revise; career items close the route. Done items stay visible so you can see the whole map.</div>`;
  p.stages.forEach((stage, i) => {
    const active = p.next && stage.key === p.next.stageKey;
    h += `<details class="hl"${active ? ' open' : ''}><summary>${i + 1}. ${esc(stage.title)} \u00b7 ${stage.done}/${stage.total} done \u00b7 ${fmtHours(stage.minutes)}</summary>
      <div class="planlist" style="margin-top:8px">${stage.items.map(x => planItemHtml(x, p.next)).join('')}</div>
      <div class="small" style="margin-top:6px"><b>Checkpoint:</b> ${esc(stage.checkpoint)}</div>
    </details>`;
  });
  return h + `</details>`;
}
function planGapHtml(p){
  const g = p.gap;
  const rows = g.modules.filter(m => m.status !== 'covered');
  const covered = g.modules.filter(m => m.status === 'covered');
  const firstMissing = rows.findIndex(m => m.status === 'missing');
  let h = `<div class="sec"><h3>Full-syllabus gap map</h3>
    <div class="small">The brochure has 14 modules; the portal recordings stop at Session 63. These ${rows.length} modules are unrecorded or only partly covered. This is the difference between ticking 131 items and being able to answer the interview questions the brochure promises.</div>
    <div class="planstats">
      <div class="stat"><b>${g.missing}</b><span>unrecorded modules</span></div>
      <div class="stat"><b>${g.partial}</b><span>partly covered</span></div>
      <div class="stat"><b>${fmtMin(g.minutes)}</b><span>gap study estimate</span></div>
      <div class="stat"><b>${g.covered}</b><span>fully covered</span></div>
    </div>`;
  rows.forEach((m, i) => {
    const badge = m.status === 'missing' ? 'interview' : 'reference';
    const statusText = m.status === 'missing' ? 'No recording' : 'Partly covered';
    h += `<details class="hl planblock"${i === firstMissing ? ' open' : ''}><summary>${esc(m.rawTitle)} \u00b7 <span class="kbadge ${badge}">${statusText}</span> \u00b7 ${fmtMin(m.minutes)}</summary>
      <div class="small" style="margin-top:6px"><b>Portal basis:</b> ${esc(m.by)}</div>
      <div class="small">${esc(m.why)}</div>
      <div class="small" style="margin-top:8px"><b>${m.status === 'missing' ? 'Exact study order' : 'Missing topics to add'}:</b></div>
      <ol class="topics">${m.missing.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <div class="gapnote"><b>Checkpoint:</b> ${esc(m.checkpoint)}</div>
    </details>`;
  });
  if (covered.length) {
    h += `<details class="hl planblock"><summary>Fully covered by the portal (${covered.length})</summary><div class="small" style="margin-top:6px">${covered.map(m => esc(m.rawTitle)).join(' \u00b7 ')}</div></details>`;
  }
  return h + `</div>`;
}
function planProtocolHtml(p){
  const c = p.course;
  return `<details class="hl planblock" open><summary><b>Best-results protocol</b> \u00b7 how to study each step</summary>
    <div class="small" style="margin-top:8px">The route is only half the result. This loop is what turns watched sessions into recall you can use in an interview.</div>
    <ol class="topics">
      <li><b>Preview (5 min):</b> read the item title and write two questions you expect it to answer.</li>

function planText(c){

function quizHtml(c,s){
  const q = s.quiz;
  if (!q) return `<div class="small">${isItemCourse(c)
    ? 'A short random quiz on the ' + markedItems(c).length + ' item' + (markedItems(c).length === 1 ? '' : 's') + ' you have ticked.'

  if (q.i>=q.qs.length) return `<div class="lesson"><b>Quiz finished:</b> ${q.score}/${q.qs.length} correct.<br>Confidence is now ${Math.round(c.confidence??0)}%.</div><div class="actions"><button class="primary" data-quiz="${c.id}">Another quiz</button></div>`;
  const cur = q.qs[q.i];
  let h = `<div class="q"><div class="small">Question ${q.i+1} of ${q.qs.length}</div><div><b>${esc(cur.question)}</b></div>`;
  cur.options.forEach((o,k)=>{

  return h+'</div>';
}

  if (isItemCourse(c)) return { from: 0, to: 100, marked: markedItems(c).length };

function parseSyllabus(text){
  const raw = String(text || '');
  const mods = []; let cur = null;
  for (const line0 of raw.split(/\r?\n/)) {
    const line = line0.trim(); if (!line) continue;
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      const title = h[1].trim();
      const num = (title.match(/^Module\s+(\d+)/i) || [])[1];
      cur = { num: num ? Number(num) : null, rawTitle: title,
        title: title.replace(/^Module\s+\d+\s*[\u2014\u2013-]\s*/i, ''), topics: [] };
      mods.push(cur); continue;
    }
    if (!cur) continue;
    const b = line.match(/^[-*\u2022]\s+(.+)$/);
    if (b) cur.topics.push(b[1].trim());
  }
  if (!mods.length) {
    const lines = raw.split(/\r?\n/).map(x => x.replace(/^[-*\u2022]\s+/, '').trim()).filter(Boolean);
    if (lines.length) return [{ num:null, rawTitle:'Syllabus', title:'Syllabus', topics:lines }];
  }
  return mods.filter(m => m.topics.length);
}

function planKind(s){
  const t = String(s.label || '');
  if (s.module === 'Add-on sessions' || /LinkedIn|freelanc|MAANG|Resume Building|Communication Skills/i.test(t)) return 'career';
  if (/memes/i.test(t)) return 'light';
  if (/interview|questions|scenario|prep|mock/i.test(t) || (/handbook/i.test(t) && !/visual/i.test(t))) return 'interview';
  if (/project|weekend-task|^task$|pipeline for/i.test(t)) return 'practice';
  if (/^SESSION-\d+/i.test(t) || /^live class/i.test(t)) return 'learn';
  if (s.module !== 'Notes' && /^(docker|git|linux)\s+class/i.test(t)) return 'learn';
  return 'reference';
}
function kindLabel(k){
  return ({ learn:'Learn', reference:'Reference', practice:'Build', interview:'Interview', career:'Career', light:'Break' })[k] || 'Study';
}
function planMinutes(s){
  const k = planKind(s), t = String(s.label || '');
  if (k === 'learn') {
    if (/interaction|live class/i.test(t)) return 45;
    if (/project/i.test(t)) return 120;
    return 90;
  }
  if (k === 'practice') return /project/i.test(t) ? 120 : 60;
  if (k === 'interview') return 45;
  if (k === 'career') return 60;
  if (k === 'light') return 5;
  if (/full notes|handbook|cheat sheet|guide/i.test(t)) return 45;
  if (/install|commands|jenkinsfile|dockerfile|manifest|compose|class-\d/i.test(t)) return 20;
  return 30;
}
function planSourceItems(c){
  if (isItemCourse(c)) return c.sessions.map(s => ({ ...s }));
  const mods = parseSyllabus(c.scope);
  const flat = [];

    id: 't' + mi + '_' + ti, label: t, module: m.title || ('Module ' + (mi + 1)), done: false
  })));
  const pct = Math.max(0, Math.min(100, c.progress || 0));
  const n = Math.round(flat.length * pct / 100);
  flat.forEach((s, i) => { s.done = i < n; });
  return flat;
}
function planStages(c, items){
  if (!isItemCourse(c)) {
    const names = [...new Set(items.map(s => s.module))];
    return names.map((name, i) => ({
      key: 'm' + i, title: name,
      why: 'Syllabus module ' + (i + 1) + ' — study in brochure order.',
      checkpoint: 'Explain ' + name + ' back in three minutes without notes.',
      items: items.filter(s => s.module === name)
    }));
  }
  const used = new Set();
  const stages = PLAN_STAGES.map(def => {
    const own = items.filter(s => def.modules.includes(s.module));
    const notes = def.noteMatch ? items.filter(s => s.module === 'Notes' && def.noteMatch.test(s.label)) : [];
    own.concat(notes).forEach(s => used.add(s.id));
    return { ...def, items: [...own, ...notes] };
  });
  const rest = items.filter(s => !used.has(s.id));
  if (rest.length) stages.push({
    key: 'more', title: 'Remaining portal items',
    why: 'Items that do not belong to a named module.',
    checkpoint: 'Close these out to reach 100% on the portal.',
    items: rest
  });
  return stages.filter(st => st.items.length);
}
function planWeeks(remaining, hours, stages, route){
  const cap = Math.max(60, Math.round(hours * 60));
  const doneIds = new Set(route.filter(x => x.done).map(x => x.id));
  const completed = new Set(stages.filter(st => st.items.every(x => x.done)).map(st => st.key));
  const weeks = [];
  let cur = { items: [], min: 0 };
  const push = () => {
    if (!cur.items.length) return;
    const reached = stages.filter(st => st.items.every(x => doneIds.has(x.id)) && !completed.has(st.key));
    reached.forEach(st => completed.add(st.key));
    cur.milestones = reached;
    weeks.push(cur);
    cur = { items: [], min: 0 };
  };
  for (const it of remaining) {
    if (cur.items.length && cur.min + it.min > cap) push();
    cur.items.push(it); cur.min += it.min; doneIds.add(it.id);
    if (cur.min >= cap) push();
  }
  push();
  return weeks;
}
function buildGapPlan(c){
  if (!isItemCourse(c)) return null;
  const mods = parseSyllabus(c.scope);
  if (!mods.length) return null;
  const out = [];
  for (const m of mods) {
    if (!m.num) continue;
    const cov = SYLLABUS_COVERAGE[m.num] || { status:'self-check', by:'Not mapped to a portal item', gap:[], why:'', checkpoint:'' };
    const missing = cov.status === 'missing' ? m.topics.slice() : (cov.status === 'partial' ? cov.gap.slice() : []);
    const minutes = cov.status === 'missing' ? m.topics.length * 50 : (cov.status === 'partial' ? missing.length * 45 : 0);
    out.push({ ...m, status: cov.status, by: cov.by, why: cov.why, checkpoint: cov.checkpoint, missing, minutes });
  }
  return {
    modules: out,
    minutes: out.reduce((a, x) => a + x.minutes, 0),
    missing: out.filter(x => x.status === 'missing').length,
    partial: out.filter(x => x.status === 'partial').length,
    covered: out.filter(x => x.status === 'covered').length
  };
}
function planHoursFor(c){
  const s = st(c.id);
  if (s.planHours) return s.planHours;
  let v = 10;
  try { const raw = Number(localStorage.getItem('ct-plan-hours')); if (raw >= 2 && raw <= 60) v = raw; } catch (e) {}
  s.planHours = v; return v;
}
function buildPlan(c){
  const items = planSourceItems(c);
  const defs = planStages(c, items);
  let step = 0;
  const stages = defs.map(def => {
    const list = def.items.map(s => {
      step++;
      const kind = planKind(s);
      return { ...s, step, kind, min: planMinutes(s), stageKey: def.key, stageTitle: def.title };
    });
    return {
      ...def, items: list, total: list.length,
      done: list.filter(x => x.done).length,
      minutes: list.reduce((a, x) => a + x.min, 0),
      remainingMinutes: list.filter(x => !x.done).reduce((a, x) => a + x.min, 0),
      next: list.find(x => !x.done) || null
    };
  });
  const route = stages.flatMap(st => st.items);
  const remaining = route.filter(x => !x.done);
  const hours = planHoursFor(c);
  const weekPlan = planWeeks(remaining, hours, stages, route);
  const totalMinutes = remaining.reduce((a, x) => a + x.min, 0);
  const gap = buildGapPlan(c);
  const fullMinutes = totalMinutes + (gap ? gap.minutes : 0);
  const fullWeeks = Math.max(weekPlan.length, Math.ceil(fullMinutes / Math.max(60, hours * 60)));
  return {
    course: c, stages, route, remaining, totalMinutes, hours,
    weeks: weekPlan, weekCount: weekPlan.length, next: remaining[0] || null,
    gap, fullMinutes, fullWeeks,
    finish: new Date(Date.now() + weekPlan.length * 7 * 86400000),
    fullFinish: new Date(Date.now() + fullWeeks * 7 * 86400000)
  };
}
async function train(id){
  const c = courses.find(x=>x.id===id); if(!c) return;
  if (c.pending){ openCourse(id); return; }
  const s = st(id); s.busy='train'; s.err=null; openCourse(id);
  const b = blockRange(c);
  const { from, to } = b;
  if (b.marked === 0){ s.busy=null; s.err='Tick at least one item in Portal progress, then train.'; render(); return; }
  const scope = scopeFor(c);
  const label = b.marked != null ? 'Revision of your ' + b.marked + ' marked item' + (b.marked === 1 ? '' : 's') : '';
  const earlier = (c.lessons||[]).length
    ? 'Earlier lessons covered: ' + c.lessons.map(l => l.label || (l.from + '-' + l.to + '%')).join(', ') + '. Do not repeat them.'
    : '';
  const prompt = `You are my personal tutor. Below is the full scope of a course; treat it as 100% of the material.
Course: ${c.name}
Scope:
${scope||'(none given, infer a standard syllabus for this course name)'}

Split the scope into an ordered sequence by percentage. I have covered ${from}% so far. Teach me the part of the course from ${from}% to ${to}%.
Write a clear study lesson: start with a one-line list of what this block covers, then teach each topic with explanation, a concrete example, and a common mistake. End with a "Key takeaways" bullet list.
Format: plain text using "## Heading", "- bullet" and **bold** only. No tables, no code fences.
${earlier}${label ? '\nLabel: ' + label : ''}`;
  render();
  try{
    const r = await sample(prompt,{modelTier:'default',cache:false});
    await save(id,{pending:{from,to,label,text:r.text}});
  }catch(e){ s.err = e.code==='not_granted'?'Permission to ask Claude was declined.':'Could not generate the lesson: '+(e.message||e.code); }
  s.busy=null; render();
}
async function finish(id){
  const c = courses.find(x=>x.id===id); if(!c||!c.pending) return;
  const lessons=[...(c.lessons||[]), c.pending];
  const patch = { lessons, pending: null };
  // A course driven by ticked portal items keeps its percentage from those items only.
  if (!(c.sessions && c.sessions.length)) patch.progress = c.pending.to;
  await save(id, patch);
}
async function startQuiz(id){
  const c = courses.find(x=>x.id===id); if(!c) return;
  const s = st(id); s.busy='quiz'; s.err=null; openCourse(id); render();
  const covered = c.progress||0;
  const prev = (c.askedQs||[]).slice(-25);
  const prompt = `Create a random 5-question multiple-choice quiz for the course "${c.name}".
Full course scope (100%):
${scopeFor(c)||'(infer from course name)'}

${isItemCourse(c)
  ? 'The scope above lists only the ' + markedItems(c).length + ' items the learner has marked as watched, so ask ONLY about those items.'
  : 'The learner has covered only the first ' + covered + '% of this scope, so ask ONLY about material within that portion.'}${(c.lessons||[]).length?'\nLessons taught so far:\n'+c.lessons.map(l=>l.text.slice(0,1500)).join('\n---\n'):''}
Mix easy, medium and hard. Randomize which option is correct. Avoid repeating these earlier questions:
${prev.join('\n')||'(none)'}

Return JSON only: an array of 5 objects {"question":string,"options":[4 strings],"answer":index 0-3,"explanation":string (one or two sentences)}.`;
  try{
    const qs = await sample.json(prompt,{modelTier:'default',cache:false});
    if(!Array.isArray(qs)||!qs.length) throw new Error('No questions returned');
    s.quiz={qs:qs.filter(q=>q&&q.options&&q.options.length===4),i:0,picked:null,score:0};
  }catch(e){ s.err='Could not build the quiz: '+(e.message||e.code); }
  s.busy=null; render();
}
async function pick(k){
  const c = courses.find(x=>x.id===selected); const q = st(selected).quiz; if(!c||!q||q.picked!=null) return;
  const cur = q.qs[q.i]; q.picked=k; const ok = k===cur.answer; if(ok) q.score++;
  const prevConf = c.confidence;
  const conf = prevConf==null ? (ok?70:30) : prevConf + ((ok?100:0)-prevConf)*0.2;
  render();
  await save(c.id,{confidence:Math.round(conf*10)/10, quizTotal:(c.quizTotal||0)+1, quizCorrect:(c.quizCorrect||0)+(ok?1:0),
    askedQs:[...(c.askedQs||[]),cur.question].slice(-40)});
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return; const d=b.dataset;
  if (d.open) openCourse(d.open);
  else if (d.plan) togglePlan(d.plan);
  else if (d.planclose) { const c = courses.find(x => x.id === selected); if (c) { setPlanOpen(c, false); render(); } }
  else if (d.plancopy !== undefined) copyPlan();
  else if (d.train) train(d.train);
  else if (d.quiz){ startQuiz(d.quiz); }
  else if (d.finish) finish(d.finish);
  else if (d.pick!==undefined) pick(+d.pick);
  else if (d.next){ const q=st(selected).quiz; q.i++; q.picked=null; render(); }
  else if (d.close){ selected=null; render(); }
  else if (d.del){ st(d.del).confirmDelete=true; render(); }
  else if (d.delNo){ st(selected).confirmDelete=false; render(); }
  else if (d.delYes){ try{ await ref(d.delYes).delete(); selected=null; }catch(err){ st(d.delYes).err='Could not delete.'; render(); } }
  else if (d.edit){ st(d.edit).editing=true; render(); }
  else if (d.canceledit){ st(selected).editing=false; render(); }
  else if (d.saveedit){ const v=$('editScope').value; st(selected).editing=false; await save(d.saveedit,{scope:v}); }
  else if (d.sessask){ st(selected).clear = d.sessask; render(); }
  else if (d.sessclearno){ st(selected).clear = null; render(); }
  else if (d.sessclear !== undefined){
    const c = courses.find(x=>x.id===selected);
    if (!c || !c.sessions) return;
    st(c.id).clear = null;
    st(c.id).openMods = { ...(st(c.id).openMods || {}), [d.sessclear]: false };   // module folds once it is cleared
    const sessions = c.sessions.map(s => s.module === d.sessclear ? { ...s, done: false } : s);
    const done = sessions.filter(s => s.done).length;
    const patch = { sessions, progress: Math.round((done / sessions.length) * 100) };
    if (c.pending) patch.pending = null;   // a cleared module invalidates the lesson in flight
    await save(c.id, patch);
  }
  else if (d.sessall!==undefined){
    const c = courses.find(x=>x.id===selected);
    if (!c || !c.sessions) return;
    const items = c.sessions.filter(s=>s.module===d.sessall);
    const allDone = items.every(s=>s.done);
    const sessions = c.sessions.map(s => s.module===d.sessall ? {...s, done:!allDone} : s);
    const done = sessions.filter(s=>s.done).length;
    await save(c.id,{sessions, progress:Math.round((done/sessions.length)*100)});
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d || d.tagName !== 'DETAILS' || !d.dataset.mod || !selected) return;
  const ui = st(selected);
  ui.openMods = { ...(ui.openMods || {}), [d.dataset.mod]: d.open };
}, true);
document.addEventListener('input', e => {
  if (e.target.id !== 'progRange') return;
  const out = e.target.closest('.progset') && e.target.closest('.progset').querySelector('.progval');
  if (out) out.textContent = e.target.value + '%';
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'planHours') {
    const c = courses.find(x => x.id === selected);
    if (!c) return;
    st(c.id).planHours = Math.max(2, Math.min(60, Number(t.value) || 10));
    try { localStorage.setItem('ct-plan-hours', String(st(c.id).planHours)); } catch (err) {}
    render();
    return;
  }
  if (t.id === 'progRange') {
    const c = courses.find(x => x.id === selected);
    if (!c) return;
    const v = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0)));
    const patch = { progress: v };
    if (c.pending && v >= c.pending.to) patch.pending = null;
    await save(c.id, patch);
    return;
  }
  if (t.matches('input[data-sess]')) {
    const c = courses.find(x => x.id === selected);
    if (!c || !c.sessions) return;
    const sessions = c.sessions.map(s => s.id === t.dataset.sess ? { ...s, done: t.checked } : s);
    const done = sessions.filter(s => s.done).length;
    const patch = { sessions, progress: Math.round((done / sessions.length) * 100) };
    if (!t.checked && c.pending) patch.pending = null;   // unticking drops the revision block
    await save(c.id, patch);
  }
});

$('toggleAdd').onclick=()=>{ $('addForm').hidden=!$('addForm').hidden; if(!$('addForm').hidden)$('newName').focus(); };
// Backup and the /code browser only exist on the local Node server.
const localOnly = (() => {
  try { return location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname); }
  catch (e) { return true; }
})();
if (!localOnly) {
  $('backupBtn').hidden = true;
  const codeLink = document.querySelector('header a.linkbtn');
  if (codeLink) codeLink.hidden = true;
}
$('backupBtn').onclick = async () => {
  if (!localOnly) return;
  const btn = $('backupBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/backup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: localStorage.getItem('ct-db-v1') || '{"courses":{}}'
    });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(j.error || ('HTTP ' + res.status));
    $('summary').textContent = 'Backup saved to ' + j.file;
  } catch (e) {
    $('summary').textContent = 'Backup failed: ' + (e.message || e) + ' (start the app with npm start so /api/backup exists)';
  }
  btn.disabled = false;
};
$('cancelAdd').onclick=()=>{ $('addForm').hidden=true; $('addForm').reset(); };
$('addForm').addEventListener('submit', async e=>{
  e.preventDefault(); if(!db) return;
  const btn=$('saveAdd'); btn.disabled=true;
  try{
    const r = await db.collection('courses').add({name:$('newName').value.trim(), scope:$('newScope').value.trim(),
      progress:0, confidence:null, quizTotal:0, quizCorrect:0, lessons:[], pending:null, askedQs:[], createdAt:Date.now()});
    $('addForm').reset(); $('addForm').hidden=true; openCourse(r.id);
  }catch(err){ $('summary').textContent='Could not save the course: '+(err.message||err.code); }
  btn.disabled=false;
});

/* ---------- boot ---------- */
/* First run in any browser: build the DevOps course from the bundled item list,
   so a fresh origin (for example the Vercel site) is not an empty page. */
async function seedIfEmpty(){
  if (localStorage.getItem('ct-seeded-v1')) return;
  try {
    const res = await fetch('devops-sessions.json', { cache: 'no-store' });
    if (!res.ok) return;
    const raw = await res.json();
    if (!Array.isArray(raw) || !raw.length) return;
    let scope = '';
    try { const s = await fetch('devops-syllabus.txt', { cache: 'no-store' }); if (s.ok) scope = await s.text(); } catch (e) {}
    const made = await db.collection('courses').add({
      name: 'DevOps with Multi Cloud (AWS + Azure)',
      scope: scope || 'DevOps with Multi Cloud (AWS + Azure)',
      progress: 0, confidence: null, quizTotal: 0, quizCorrect: 0,
      lessons: [], pending: null, askedQs: [], createdAt: Date.now(),
      sessions: raw.map((s, i) => ({ id: 's' + (i + 1), label: s.label, module: s.module, done: false }))
    });
    localStorage.setItem('ct-seeded-v1', '1');
    if (made && made.id) openCourse(made.id);
  } catch (e) { /* leave the store empty */ }
}

render();
let firstSnap = true;
(async()=>{
  const timer = setTimeout(()=>{ if(!loaded){ loaded=true; $('summary').textContent='Could not load saved courses. Check that you are signed in.'; render(); }},10000);
  [db, sample] = await Promise.all([claude.use('db'), claude.use('sample')]);
  if(!db){ clearTimeout(timer); loaded=true; $('summary').textContent='Sign in to load and save your courses.'; render(); return; }
  db.collection('courses').orderBy('createdAt','asc').onSnapshot(snap=>{
    clearTimeout(timer); loaded=true;
    courses = snap.docs.map(d=>({id:d.id,...d.data()}));
    if (selected && !courses.some(c=>c.id===selected)) selected=null;
    render();
    if (firstSnap){ firstSnap = false; if (!courses.length) seedIfEmpty(); }
  }, err=>{ clearTimeout(timer); loaded=true; $('summary').textContent='Could not load courses: '+(err.message||err.code); render(); });
  if(!sample) document.querySelectorAll('[data-train],[data-quiz]').forEach(b=>b.disabled=true);
})();
